# ============================================================
#  DocLib — Docker Compose
#  Orchestrates: frontend, backend, ai-service, mongodb
#  Run:  docker compose up --build
#  Stop: docker compose down
# ============================================================

services:

  # ──────────────────────────────────────────────
  # MongoDB — Database
  # ──────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: doclib-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"           # Expose so you can connect with MongoDB Compass
    volumes:
      - mongo-data:/data/db    # Persist database across restarts
    networks:
      - doclib-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────
  # AI Service — Python FastAPI + ChromaDB
  # ──────────────────────────────────────────────
  ai-service:
    build:
      context: .                    # Root context → uses root .dockerignore
      dockerfile: ai-service/Dockerfile
    image: doclib-ai-service
    container_name: doclib-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"               # FastAPI / Swagger UI at localhost:8000
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_PATH=/app/data/chroma_db
      - UPLOAD_PATH=/app/uploads            # Shared with backend container
    volumes:
      - chroma-data:/app/data/chroma_db    # Persist vector embeddings
      - backend-uploads:/app/uploads        # Shared with backend — reads uploaded files
    networks:
      - doclib-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s          # Extra time for sentence-transformer model loading

  # ──────────────────────────────────────────────
  # Backend — Node.js Express API Gateway
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .                    # Root context → uses root .dockerignore
      dockerfile: backend/Dockerfile
    image: doclib-backend
    container_name: doclib-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # ⚠️ Use service names (not localhost) inside Docker network
      - MONGODB_URI=${MONGODB_URI}
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
      # Secrets — loaded from your root .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    volumes:
      - backend-uploads:/app/uploads    # Persist multer uploaded files
    networks:
      - doclib-network
    depends_on:
      mongo:
        condition: service_healthy      # Wait for MongoDB to be ready
      ai-service:
        condition: service_healthy      # Wait for AI service to be ready
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────
  # Frontend — React + Vite → Nginx
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .                    # Root context → uses root .dockerignore
      dockerfile: frontend/Dockerfile
    image: doclib-frontend
    container_name: doclib-frontend
    restart: unless-stopped
    ports:
      - "5173:80"                # Nginx listens on 80 inside, exposed as 5173
    networks:
      - doclib-network
    depends_on:
      backend:
        condition: service_healthy   # Wait for backend to be ready

# ============================================================
#  Named Volumes — data persists even after `docker compose down`
#  Only `docker compose down -v` will delete volumes
# ============================================================
volumes:
  mongo-data:        # MongoDB database files
  chroma-data:       # ChromaDB vector embeddings
  backend-uploads:   # Shared: backend writes uploads, ai-service reads them

# ============================================================
#  Network — private bridge so services talk by name
#  backend  → mongo:27017
#  backend  → ai-service:8000
#  frontend → backend:3001  (via nginx proxy_pass)
# ============================================================
networks:
  doclib-network:
    driver: bridge
