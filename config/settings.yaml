chunking:
  strategy: fixed_size
  chunk_size: 512
  chunk_overlap: 64
  min_chunk_size: 100
retrieval:
  top_k: 6
  similarity_threshold: 0.65
  hybrid_search: true
  bm25_weight: 0.3
  vector_weight: 0.7
  rerank: true
  rewrite: true
llm:
  provider: gemini
  model: gemini-flash-latest
  temperature: 0.2
  max_tokens: 2048
  stream: true
embeddings:
  provider: gemini
  model: models/gemini-embedding-001
  batch_size: 100
cache:
  enabled: true
  ttl_seconds: 3600
logging:
  level: INFO
  structured: true
