server {
    listen 80;
    server_name localhost;

    # Root directory — where Vite's built files live
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────
    # API Proxy → forwards /api/* to the backend
    # Replace "backend" with your backend's hostname
    # (use "localhost:3001" if running backend outside Docker,
    #  or "backend:3001" if using docker-compose)
    # ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        # WebSocket support (needed for ws module in your backend)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # ─────────────────────────────────────────────
    # React Router — serve index.html for all routes
    # so that refreshing /dashboard or /login works
    # ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────
    # Cache static assets aggressively
    # ─────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─────────────────────────────────────────────
    # Security headers
    # ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
